name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kaiju
          POSTGRES_PASSWORD: kaiju
          POSTGRES_DB: kaiju
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kaiju -d kaiju"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://kaiju:kaiju@localhost:5432/kaiju?schema=public
      APP_PASSWORD: ci-not-a-real-password
      SESSION_SECRET: ci-not-a-real-secret

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma migrate deploy

      - name: Check migrations match the schema
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
